[project]
name = "pypoolstation"
version = "0.8.0"
description = "Python library to interact with the API of the Poolstation (https://poolstation.net) domotic platform for pool equipment"
authors = [{ name = "cibernox", email = "miguel.camba@gmail.com" }]
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.8.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pypoolstation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
